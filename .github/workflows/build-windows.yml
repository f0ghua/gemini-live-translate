name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (必填，例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      create_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true
      release_description:
        description: 'Release 描述 (可选，留空则自动从 commits 生成)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Executable (Nuitka)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          # Strip leading 'v' for release name
          name="${version#v}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          # Convert to X.Y.Z.W for Nuitka file-version
          nuitka_version="${name}"
          dots=$(echo "$nuitka_version" | tr -cd '.' | wc -c)
          while [ "$dots" -lt 3 ]; do
            nuitka_version="${nuitka_version}.0"
            dots=$((dots + 1))
          done
          echo "nuitka_version=${nuitka_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Nuitka compiler
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-compiler-${{ runner.os }}-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build with Nuitka
        shell: cmd
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}\nuitka-cache
        run: |
          if not exist "%NUITKA_CACHE_DIR%" mkdir "%NUITKA_CACHE_DIR%"
          python -m nuitka ^
            --onefile ^
            --windows-console-mode=disable ^
            --enable-plugins=pyside6 ^
            --include-package=pyaudiowpatch ^
            --include-package=numpy ^
            --include-package=scipy ^
            --include-package=websockets ^
            --include-package-data=pyaudiowpatch ^
            --nofollow-import-to=PySide6.QtQml ^
            --nofollow-import-to=PySide6.QtQuick ^
            --nofollow-import-to=PySide6.QtQuick3D ^
            --nofollow-import-to=PySide6.QtQuickWidgets ^
            --nofollow-import-to=PySide6.QtCharts ^
            --nofollow-import-to=PySide6.QtDataVisualization ^
            --nofollow-import-to=PySide6.QtWebEngineCore ^
            --nofollow-import-to=PySide6.QtWebEngineWidgets ^
            --nofollow-import-to=PySide6.QtWebChannel ^
            --nofollow-import-to=PySide6.QtMultimedia ^
            --nofollow-import-to=PySide6.QtPdf ^
            --nofollow-import-to=PySide6.QtPdfWidgets ^
            --nofollow-import-to=PySide6.QtPrintSupport ^
            --nofollow-import-to=PySide6.QtSvg ^
            --nofollow-import-to=PySide6.QtSvgWidgets ^
            --nofollow-import-to=PySide6.QtTest ^
            --nofollow-import-to=PySide6.QtOpenGL ^
            --nofollow-import-to=PySide6.QtOpenGLWidgets ^
            --nofollow-import-to=PySide6.QtBluetooth ^
            --nofollow-import-to=PySide6.QtSerialPort ^
            --nofollow-import-to=PySide6.QtSensors ^
            --nofollow-import-to=PySide6.QtPositioning ^
            --nofollow-import-to=PySide6.QtNfc ^
            --nofollow-import-to=PySide6.QtRemoteObjects ^
            --nofollow-import-to=PySide6.QtScxml ^
            --nofollow-import-to=PySide6.QtStateMachine ^
            --nofollow-import-to=PySide6.QtUiTools ^
            --nofollow-import-to=PySide6.QtWebSockets ^
            --nofollow-import-to=PySide6.QtHttpServer ^
            --output-dir=dist ^
            --output-filename=gemini-live-translate.exe ^
            --onefile-tempdir-spec={CACHE_DIR}/GeminiLiveTranslate ^
            --onefile-cache-mode=cached ^
            --company-name=GeminiLiveTranslate ^
            --product-name="Gemini Live Translate" ^
            --file-version=${{ steps.version.outputs.nuitka_version }} ^
            --product-version=${{ steps.version.outputs.nuitka_version }} ^
            --assume-yes-for-downloads ^
            --lto=yes ^
            --python-flag=-O ^
            --python-flag=no_docstrings ^
            --python-flag=no_warnings ^
            main.py

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p publish
          if [ -f "dist/gemini-live-translate.exe" ]; then
            cp dist/gemini-live-translate.exe publish/gemini-live-translate-${{ steps.version.outputs.name }}.exe
          else
            echo "Error: dist/gemini-live-translate.exe not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-live-translate-windows-${{ steps.version.outputs.name }}
          path: publish/gemini-live-translate-${{ steps.version.outputs.name }}.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gemini Live Translate ${{ inputs.version }}
          files: publish/gemini-live-translate-${{ steps.version.outputs.name }}.exe
          body: ${{ inputs.release_description }}
          generate_release_notes: ${{ inputs.release_description == '' }}
